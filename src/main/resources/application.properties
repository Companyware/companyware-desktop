spring.datasource.initialization-mode=always
spring.jpa.properties.hibernate.hbm2ddl.auto=create
companyware.version = 0.29.0
# Private installations use a local embedded database by default. Override with
# -Dcompanyware.persistence.profile=client-server for an external company server.
companyware.persistence.profile=embedded
companyware.persistence.embedded.path=data/companyware
companyware.persistence.host=localhost
companyware.persistence.port=1527
companyware.persistence.database=companyware
companyware.persistence.username=app
companyware.persistence.password=ap
