name: Publish Companyware Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared version from pom.xml, for example 0.29.1"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE to create the tag and publish the release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release request
        id: release
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -Raw .\pom.xml
          $projectVersion = [string]$pom.project.version
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $requestedVersion = '${{ inputs.version }}'.Trim()
            if ('${{ inputs.confirmation }}' -cne 'RELEASE') {
              throw 'Manual publication requires the exact confirmation RELEASE.'
            }
            if ('${{ github.ref_name }}' -cne '${{ github.event.repository.default_branch }}') {
              throw 'Manual releases must run from the default branch.'
            }
            if ($requestedVersion -cne $projectVersion) {
              throw "Requested version '$requestedVersion' does not match pom.xml version '$projectVersion'. Prepare and push the version first."
            }
            $tag = "v$requestedVersion"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Tag '$tag' already exists." }
            if ($LASTEXITCODE -ne 2) { throw "Could not verify whether tag '$tag' exists." }
          } else {
            $tag = '${{ github.ref_name }}'
            if ($tag -cne "v$projectVersion") {
              throw "Release tag '$tag' does not match pom.xml version '$projectVersion'."
            }
          }
          foreach ($required in @(
            ".\docs\release-notes\$projectVersion.md",
            ".\docs\security-review-$projectVersion.md"
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Prepared release document is missing: $required"
            }
          }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Verify framework and build portable release
        shell: pwsh
        run: .\tools\verify-framework-release.ps1

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "The pinned windows-2022 image does not provide Inno Setup 6 at $compiler."
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build self-contained Windows installer
        shell: pwsh
        run: |
          .\tools\build-windows-installer.ps1 `
            -JavaRuntimeDirectory (Join-Path $env:JAVA_HOME 'jre') `
            -InnoSetupCompiler '${{ steps.inno.outputs.compiler }}'

      - name: Prepare stable GitHub asset names
        shell: pwsh
        run: .\tools\prepare-github-release.ps1 -Tag '${{ steps.release.outputs.tag }}'

      - name: Create the approved tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.release.outputs.tag }}' -m "Companyware Desktop ${{ steps.release.outputs.version }}"
          git push origin '${{ steps.release.outputs.tag }}'

      - name: Upload release-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: companyware-desktop-${{ steps.release.outputs.tag }}
          path: target/release/publish/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$pom = Get-Content -Raw .\pom.xml
          $version = [string]$pom.project.version
          $arguments = @(
            'release', 'create', '${{ steps.release.outputs.tag }}',
            '--verify-tag',
            '--title', "Companyware Desktop $version",
            '--notes-file', ".\docs\release-notes\$version.md"
          )
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          $arguments += Get-ChildItem .\target\release\publish -File | ForEach-Object { $_.FullName }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
